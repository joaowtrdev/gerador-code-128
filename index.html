<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gerador Code 128 em Lote</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="wrap">
    <h1>Gerador Code 128 em lote</h1>

    <div class="row">
      <div>
        <textarea id="codes" placeholder="Cole aqui... (um por linha)
Ex:
888001299767384
888001299767385
888001299767386"></textarea>

        <div class="progress">
          <div class="bar" id="bar"></div>
        </div>
        <div class="status" id="status">Pronto.</div>

        <div class="viewerWrap">
          <div class="viewerHeader">
            <div class="counter" id="counter">0/0</div>

            <div class="navRow">
              <button class="navBtn" id="prevBtn" disabled>◀</button>
              <button class="navBtn" id="nextBtn" disabled>▶</button>
              <input class="goto" id="goto" type="number" min="1" placeholder="Ir para" />
            </div>
          </div>

          <div class="viewerCard">
            <div class="paper">
              <canvas id="canvas"></canvas>
            </div>
            <div class="codeText" id="codeText">—</div>
            <div class="hint">Dica: use as setas do teclado (← →) ou digite o número no “Ir para” e aperte Enter.</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <strong>Configurações</strong>

        <label>Scale (grossura/tamanho)</label>
        <input id="scale" type="number" value="4" min="1" max="10" />

        <label>Height (altura das barras — mm)</label>
        <input id="height" type="number" value="15" min="5" max="40" />

        <label>Text size (tamanho do número)</label>
        <input id="textsize" type="number" value="12" min="6" max="30" />

        <label>Padding (margem branca — px)</label>
        <input id="padding" type="number" value="10" min="0" max="60" />

        <label>Limite máximo de códigos (até 10.000)</label>
        <input id="limit" type="number" value="10000" min="1" max="10000" />

        <button class="primary" id="btnLoad">Carregar lista</button>
        <button class="secondary" id="btnRender">Regerar código atual</button>
        <button class="secondary" id="btnClear">Limpar</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bwip-js/4.7.0/bwip-js-min.js"></script>
  <script src="./app.js"></script>
</body>

</html>
